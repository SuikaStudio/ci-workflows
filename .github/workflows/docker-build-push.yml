name: Docker Build & Push

on:
  workflow_call:
    inputs:
      registry:
        description: 'Docker registry URL'
        required: false
        type: string
        default: 'ghcr.io'
      context:
        description: 'Docker build context path'
        required: false
        type: string
        default: '.'
      dockerfile:
        description: 'Path to Dockerfile'
        required: false
        type: string
        default: './Dockerfile'
      tags:
        description: 'List of image tags (separated by newlines or commas)'
        required: true
        type: string
      build_args:
        description: 'List of build-time variables (KEY=value separated by newlines)'
        required: false
        type: string
        default: ''
      target:
        description: 'Target build stage in a multi-stage Dockerfile'
        required: false
        type: string
        default: ''
      push:
        description: 'Push image to registry after build'
        required: false
        type: boolean
        default: true
    outputs:
      image_digest:
        description: 'Docker image digest SHA'
        value: ${{ jobs.build_and_push.outputs.digest }}
    secrets:
      token:
        description: 'Registry authentication token (e.g. GITHUB_TOKEN)'
        required: true

jobs:
  build_and_push:
    name: Build & Push Image
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build_push.outputs.digest }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ inputs.registry }}
          username: ${{ github.actor }}
          password: ${{ secrets.token }}

      - name: Normalize tags to lowercase
        id: meta
        run: |
          LOWER_TAGS=$(echo "${{ inputs.tags }}" | tr '[:upper:]' '[:lower:]')
          echo "tags<<EOF" >> $GITHUB_OUTPUT
          echo "$LOWER_TAGS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        id: build_push
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          target: ${{ inputs.target != '' && inputs.target || '' }}
          build-args: ${{ inputs.build_args }}
          push: ${{ inputs.push }}
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

name: Versioning

on:
  workflow_call:
    inputs:
      branch:
        description: 'Target branch (e.g. dev or main)'
        required: true
        type: string
    outputs:
      new_tag:
        description: 'Generated version tag'
        value: ${{ jobs.versioning.outputs.new_tag }}
      changelog_file:
        description: 'Path to generated changelog file'
        value: ${{ jobs.versioning.outputs.changelog_file }}
    secrets:
      token:
        description: 'GitHub token'
        required: true

jobs:
  versioning:
    name: Versioning
    runs-on: ubuntu-latest
    outputs:
      new_tag: ${{ steps.semver.outputs.new_tag }}
      changelog_file: ${{ steps.changelog.outputs.changelog_file }}
    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.token }}

      - name: Checkout ci-workflows scripts
        uses: actions/checkout@v4
        with:
          repository: SuikaStudio/ci-workflows
          path: ci-workflows
          token: ${{ secrets.token }}

      - name: Calculate semantic version
        id: semver
        run: |
          chmod +x ci-workflows/.github/scripts/semver.sh
          ci-workflows/.github/scripts/semver.sh "${{ inputs.branch }}"

      - name: Generate changelog
        id: changelog
        run: |
          chmod +x ci-workflows/.github/scripts/changelog.sh
          ci-workflows/.github/scripts/changelog.sh "${{ steps.semver.outputs.prev_dev_tag }}"

      - name: Upload changelog artifact
        uses: actions/upload-artifact@v4
        with:
          name: changelog
          path: ${{ steps.changelog.outputs.changelog_file }}
          retention-days: 1